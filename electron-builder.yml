appId: com.aeropost3d.windows.mail
productName: AeroPost 3D Mail
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - firebase-applet-config.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "AeroPost 3D — Почтовая программа"
portable:
  artifactName: "${productName}-Portable-${version}-${arch}.${ext}"

